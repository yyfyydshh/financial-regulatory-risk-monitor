<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>{{TITLE}}</title>
</head>
<body style="margin:0;padding:0;background:#edf2f7;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif;line-height:1.65;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{PREHEADER}}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#edf2f7;border-collapse:collapse;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="920" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:920px;background:#ffffff;border-collapse:separate;border-spacing:0;border-radius:18px;overflow:hidden;box-shadow:0 14px 42px rgba(16,35,67,.12);">
          <tr><td style="height:5px;background:#e9a23b;font-size:0;line-height:0;">&nbsp;</td></tr>
          <tr>
            <td style="padding:36px 40px 30px;background:#102f4d;color:#ffffff;">
              <div style="display:inline-block;padding:5px 10px;border:1px solid #52708c;border-radius:14px;font-size:11px;letter-spacing:1px;color:#d7e5f1;margin-bottom:13px;">监管风险监测 · 管理层简报</div>
              <h1 style="font-size:28px;line-height:1.35;margin:0 0 16px;font-weight:750;letter-spacing:.2px;">{{TITLE}}</h1>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;"><tr>
                <td style="padding-right:22px;font-size:12px;color:#bed0df;">报告编号<br><strong style="font-size:13px;color:#ffffff;">{{REPORT_ID}}</strong></td>
                <td style="padding-left:22px;border-left:1px solid #49647e;font-size:12px;color:#bed0df;">生成时间<br><strong style="font-size:13px;color:#ffffff;">{{GENERATED_AT}}</strong></td>
              </tr></table>
            </td>
          </tr>
          <tr>
            <td style="padding:30px 40px 20px;">{{CONTENT}}</td>
          </tr>
          <tr>
            <td style="padding:22px 38px 30px;background:#f8fafc;border-top:1px solid #e5eaf0;">
              <div style="font-size:12px;color:#667085;line-height:1.7;">{{DISCLAIMER}}</div>
            </td>
          </tr>
        </table>
        <div style="font-size:11px;color:#98a2b3;margin-top:14px;">本邮件正文与附件使用同一份 HTML 报告。</div>
      </td>
    </tr>
  </table>
</body>
</html>
